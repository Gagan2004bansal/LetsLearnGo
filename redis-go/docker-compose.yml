services:
  redis:
    image: redis:7.4-alpine
    container_name: redis_cache
    restart: always
    ports: 
      - "6379:6379"
    command: >
      redis-server
      --requirepass redis#docker
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "MySecurePassword123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
    driver: local