services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: distributedSQL
      POSTGRES_DB: mydatabase
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  redis:
    image: redis:7.4-alpine
    container_name: redis_cache
    restart: always
    ports: 
      - "6379:6379"
    command: >
      redis-server
      --requirepass redis#docker
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "MySecurePassword123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3


volumes:
  postgres_data:
  redis_data:
    driver: local

